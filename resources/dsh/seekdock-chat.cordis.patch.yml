# SeekDock overlay for the shipped full SDK profile. The official sdk profile
# provides the normal dsh-base composition; this patch adds the process-local
# assistant stream used by the chat UI and the user-editable SeekDock persona.

- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: ''

# The SDK profile disables its first-prompt title provider because headless
# clients do not need session titles. SeekDock does, so reuse that provider to
# replace the deterministic first-prompt fallback with a concise model title.
#
# dsh-base caps that provider's input at 4 KiB measured against the whole first
# human message, and an over-cap request fails outright instead of truncating:
# a long first prompt kept the deterministic fallback title forever. 32 KiB
# covers pasted first prompts while keeping the per-session title request
# bounded. A patch replaces the entry's `config` object wholesale rather than
# merging it, so every dsh-base field is restated here and must be re-checked
# against dsh-base on each DSH upgrade.
- id: session-title-llm
  disabled: false
  config:
    targetWords: 5
    targetCjkCharacters: 10
    maxInputBytes: 32768
    maxOutputTokens: 4096
    timeoutMs: 60000

- id: skill-filesystem
  config:
    includeDefaultRoots: false
    customSkillDirs:
      - !!js process.env.SEEKDOCK_WORKSPACE_SKILL_DIR
      - !!js process.env.SEEKDOCK_USER_SKILL_DIR

# The standard SDK wire carries durable session events only. These bridges add
# process-local assistant frames, the private stop control, and the permission,
# approval, and plan-review round trips used by the composer UI.
- insert:
    - id: seekdock-cancel-bridge
      name: ./seekdock-cancel-bridge.mjs
    - id: seekdock-assistant-stream-bridge
      name: ./seekdock-assistant-stream-bridge.mjs
    - id: seekdock-system-prompt
      name: ./seekdock-system-prompt.mjs
    - id: seekdock-auto-review
      name: ./seekdock-auto-review.mjs
    - id: seekdock-permission-bridge
      name: ./seekdock-permission-bridge.mjs
    - id: seekdock-plan-bridge
      name: ./seekdock-plan-bridge.mjs
    - id: seekdock-plan-review-bridge
      name: ./seekdock-plan-review-bridge.mjs
    - id: seekdock-skill-bridge
      name: ./seekdock-skill-bridge.mjs
    - id: seekdock-session-title-bridge
      name: ./seekdock-session-title-bridge.mjs
    - id: seekdock-workspace-changes
      name: ./seekdock-workspace-changes.mjs
    - id: seekdock-approval-bridge
      name: ./seekdock-approval-bridge.mjs
